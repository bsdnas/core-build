site_name: BSDnas
site_description: A community fork continuing TrueNAS CORE on current FreeBSD
site_url: https://bsdnas.com/
repo_url: https://github.com/bsdnas
repo_name: bsdnas
copyright: BSDnas is not affiliated with or endorsed by iXsystems, Inc.

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Overview: index.md
  - Install: install.md
  - Upgrading from TrueNAS CORE: upgrade.md
  - Containers: containers.md
  - Building from source: building.md
  - Project status: status.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
