watchdogd_enable="YES"

# У установщика / — read-only образ, поэтому /tmp создаётся в памяти.
# Штатного размера не хватает: preserve_data копирует туда весь /data целиком,
# и при переполнении конфигурация терялась молча. Дампы ядра из /data/crash
# теперь не копируются, но запас всё равно нужен — например, под сертификаты
# и большие конфигурации.
tmpmfs="YES"
tmpsize="64m"
