watchdogd_enable="YES"

# In the installer / is a read-only image, so /tmp is created in memory.
# The default size is not enough: preserve_data copies the whole of /data
# there, and on overflow the configuration was lost silently. Kernel dumps
# from /data/crash are no longer copied, but headroom is still needed, for
# certificates and large configurations for example.
tmpmfs="YES"
tmpsize="64m"
