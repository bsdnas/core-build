NO_ZFS=${no_zfs}
ZPOOL=${ZPOOL}
ZROOTFS=${ZROOTFS}
RESOLV_CONF=/etc/resolv.conf
BASEFS=${OBJDIR}/ports
USE_PORTLINT=no
USE_TMPFS=${use_tmpfs}
GIT_URL=${ports_repo}
GIT_BRANCH=${ports_branch}
DISTFILES_CACHE=${DISTFILES_CACHE}
ALLOW_MAKE_JOBS=yes
RESTRICT_NETWORKING=no
BUILD_AS_NON_ROOT=no

# Heavy ports are built on disk rather than in tmpfs. The rust work directory
# is about ten gigabytes; in tmpfs it eats the RAM the builders need and runs
# into that limit instead of the disk one. The remaining ports keep being built
# in memory, which is faster.
TMPFS_BLACKLIST="rust llvm* gcc* node* chromium*"
TMPFS_BLACKLIST_TMPDIR="${OBJDIR}/ports/data/cache/tmp"
