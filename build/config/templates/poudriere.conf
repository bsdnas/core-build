NO_ZFS=${no_zfs}
ZPOOL=${ZPOOL}
ZROOTFS=${ZROOTFS}
RESOLV_CONF=/etc/resolv.conf
BASEFS=${OBJDIR}/ports
USE_PORTLINT=no
USE_TMPFS=${use_tmpfs}
GIT_URL=${ports_repo}
GIT_BRANCH=${ports_branch}
DISTFILES_CACHE=${DISTFILES_CACHE}
ALLOW_MAKE_JOBS=yes
RESTRICT_NETWORKING=no
BUILD_AS_NON_ROOT=no

# Тяжёлые порты собираются на диске, а не в tmpfs. Рабочий каталог rust —
# десяток гигабайт; в tmpfs он съедает оперативную память, которая нужна
# сборщикам, и упирается в неё вместо диска. Остальные порты продолжают
# собираться в памяти — так быстрее.
TMPFS_BLACKLIST=rust llvm* gcc* node* chromium*
TMPFS_BLACKLIST_TMPDIR=${OBJDIR}/ports/data/cache/tmp
